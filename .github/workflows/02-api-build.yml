name: API Build

on:
  push:
    branches: [ main ]
    paths: 
      - '.github/workflows/02-api-build.yml'
      - 'api/**'
  workflow_dispatch:

jobs:
    build:
        name: Build API
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4
        
        - name: Check .NET Runtimes
          run: dotnet --list-runtimes
        
        - name: Check .NET SDKs
          run: dotnet --list-sdks

        - run: dotnet --version
          name: Check .NET Version

        - name: Build API
          run: dotnet build --configuration Release
          working-directory: ./api
          with:
            # cache: 'dotnet'
            # cache-dependency-path: ./api/**/*.csproj
            go-version: '10.0.204'

        - name: Test API
          run: dotnet test --configuration Release
          working-directory: ./api